<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Login Pokémon</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="row vh-100 justify-content-center align-items-center">

            <div class="col-md-4">

                <div class="card shadow-lg p-4">

                    <h2 class="text-center mb-4">
                        Login Pokémon
                    </h2>

                    <form id="loginForm">

                        <div class="mb-3">

                            <input
                                type="text"
                                id="username"
                                class="form-control"
                                placeholder="Usuário"
                                required>

                        </div>

                        <div class="mb-3">

                            <input
                                type="password"
                                id="senha"
                                class="form-control"
                                placeholder="Senha"
                                required>

                        </div>

                        <button class="btn btn-danger w-100">

                            Entrar

                        </button>

                    </form>

                    <p class="text-center mt-3">

                        Não possui conta?

                        <a href="register.html">
                            Registrar
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </div>

    <img
        src="img/pikachu.png"
        class="pokemon-corner">

<script>

document
.getElementById('loginForm')
.addEventListener('submit', async (e) => {

    e.preventDefault();

    const username =
    document.getElementById('username').value;

    const senha =
    document.getElementById('senha').value;

    const resposta = await fetch(
        'http://localhost:3000/api/login',
        {

            method: 'POST',

            headers: {
                'Content-Type': 'application/json'
            },

            body: JSON.stringify({
                username,
                senha
            })

        }
    );

    const dados = await resposta.json();

    if (dados.token) {

        localStorage.setItem(
            'token',
            dados.token
        );

        window.location.href =
        'dashboard.html';

    } else {

        alert(dados.erro);

    }

});

</script>

</body>

</html>
